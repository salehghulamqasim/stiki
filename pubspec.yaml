name: stiki
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.1

dependencies:
  dynamic_color: ^1.8.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_screenutil: ^5.9.3
  google_fonts: ^7.0.0
  home_widget: ^0.9.0
  http: ^1.6.0
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  uuid: ^4.5.2
  vibration: ^3.1.5
  weather: ^3.2.1
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/LogoCircle.png"
  min_sdk_android: 21
  adaptive_icon_background: "#EFE9E2"
  adaptive_icon_foreground: "assets/LogoCircle.png"
  adaptive_icon_round:
    foreground: "assets/LogoCircle.png"
    background: "#EFE9E2"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/LogoCircle.png
    - assets/quote.png
